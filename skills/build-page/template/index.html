<title>Forja de Build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&display=swap">
<style>
/* Layout: um painel único no estilo da wiki do DS2 (Fextralife); cada seção = título Marcellus + fluxos de nós + tabelas wiki. */
:root {
  --bg: #101013;
  --panel: #181818;
  --line: #333333;
  --text: #b4b2b0;
  --head: #ffffff;
  --link: #ab966f;
  --th: #111111;
  --td: rgba(45, 45, 45, 0.85);
  --edge: #d9d9d9;
  --pos: #f0b54a;
  --neg: #6fa3d8;
  --track: #2b2b2b;
  --display: "Marcellus SC", "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --body: "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font: 14px/1.6 var(--body); }
.page { max-width: 64rem; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px clamp(14px, 3vw, 28px) 28px; display: grid; gap: 34px; }
h1, h2 { font-family: var(--display); font-weight: 400; color: var(--head); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.15; }
h2 { font-size: clamp(22px, 3.4vw, 30px); line-height: 1.3; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
p { margin: 0; }
a { color: var(--link); }
a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
section { display: grid; gap: 14px; min-width: 0; }
.pos { color: var(--pos); font-weight: 500; }
.neg { color: var(--neg); font-weight: 500; }
.muted { color: var(--text); font-size: 13px; }

/* Cabeçalho */
.top { display: grid; gap: 12px; }
.meta { font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; }
.legend span::before { content: "■ "; }
.legend .l-pos { color: var(--pos); }
.legend .l-neg { color: var(--neg); }
.legend .l-link { color: var(--link); }

/* Tabelas no estilo wiki */
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 30rem; border: 3px solid var(--edge); }
th { background: var(--th); color: var(--head); font: 400 14px var(--display); letter-spacing: 0.02em; text-align: left; padding: 6px 10px; white-space: nowrap; }
td { background: var(--td); color: var(--head); border: 1px solid var(--line); padding: 6px 10px; vertical-align: middle; font-variant-numeric: tabular-nums; }
td.r, th.r { text-align: right; }
tfoot td { font-family: var(--display); }
.cell-ic { display: flex; align-items: center; gap: 8px; }
.cell-ic img { width: 22px; height: 22px; object-fit: contain; }

/* Nós e fluxos */
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.arrow { color: var(--link); font-size: 20px; line-height: 1; }
.node { display: grid; grid-template-columns: 40px minmax(0, auto); grid-template-rows: auto auto; column-gap: 10px; align-items: center; padding: 6px 12px 6px 6px; background: var(--td); border: 1px solid var(--line); color: var(--link); text-decoration: none; min-width: 0; max-width: 100%; }
span.node { color: var(--head); }
.node .ic { grid-row: span 2; width: 40px; height: 40px; object-fit: contain; }
.node .ini { grid-row: span 2; width: 40px; height: 40px; display: grid; place-items: center; background: var(--th); color: var(--head); font: 20px var(--display); }
.node .nm { font-weight: 500; overflow-wrap: anywhere; }
a.node:hover .nm { text-decoration: underline; }
.node .sub { font-size: 12px; color: var(--text); grid-column: 2; }
.node.solo { grid-template-rows: auto; }
.equipped { display: flex; flex-wrap: wrap; gap: 8px; }

/* Passos */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.step { display: grid; gap: 12px; padding-block: 18px; border-top: 1px solid var(--line); min-width: 0; }
.step:first-child { border-top: 0; padding-top: 4px; }
.step-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.step-no { font: 26px/1 var(--display); color: var(--head); min-width: 28px; }
.step-title { font: 18px var(--display); color: var(--head); }
.badge { font: 13px var(--display); letter-spacing: 0.04em; padding: 2px 10px; border: 1px solid var(--line); background: var(--th); color: var(--head); }

/* Atributos */
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: 10px 28px; }
.stat { display: grid; grid-template-columns: 26px 3rem minmax(0, 1fr) 5.5rem; align-items: center; gap: 10px; }
.stat img { width: 26px; height: 26px; object-fit: contain; }
.stat .abbr { font-family: var(--display); color: var(--head); }
.bar { position: relative; height: 8px; background: var(--track); border: 1px solid var(--line); }
.bar .now { position: absolute; inset: 0 auto 0 0; background: var(--link); }
.bar .goal { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--pos); }
.stat .val { text-align: right; color: var(--head); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Itens e builds */
.blocks { display: grid; gap: 0; }
.block { display: grid; gap: 10px; padding-block: 16px; border-top: 1px solid var(--line); min-width: 0; }
.block:first-child { border-top: 0; padding-top: 4px; }
.block-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.label { font: 13px var(--display); color: var(--text); letter-spacing: 0.04em; }
.sources { margin: 0; padding-left: 1.2em; display: grid; gap: 2px; }
.empty { color: var(--text); font-style: italic; }
.error { padding: 16px; border: 1px solid var(--neg); color: var(--neg); }
</style>

<main class="page"><div class="panel" id="app"><p class="empty">Carregando o plano…</p></div></main>

<script>
(function () {
  const STATS = ["VGR", "END", "VIT", "ATN", "STR", "DEX", "INT", "FTH", "ADP"];
  const PASSO = { nivel: "Nível", item: "Item", chefe: "Chefe", compra: "Compra", equipar: "Equipar" };
  const fmt = new Intl.NumberFormat("pt-BR");
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ext = (url, inner, cls = "") => `<a class="${cls}" href="${esc(url)}" target="_blank" rel="noopener">${inner}</a>`;
  const cls = (sinal) => sinal === "+" ? "pos" : sinal === "-" ? "neg" : "";
  const when = (iso) => { const d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }); };
  const initial = (name) => `<span class="ini" aria-hidden="true">${esc((name || "?").trim().charAt(0).toUpperCase())}</span>`;
  const icon = (src, name) => src ? `<img class="ic" src="${esc(src)}" alt="" data-ini="${esc((name || "?").trim().charAt(0).toUpperCase())}">` : initial(name);
  function fallbackIcons(root) {
    root.querySelectorAll("img.ic").forEach((img) => {
      const swap = () => { const s = document.createElement("span"); s.className = "ini"; s.setAttribute("aria-hidden", "true"); s.textContent = img.dataset.ini; img.replaceWith(s); };
      if (img.complete && img.naturalWidth === 0) swap(); else img.addEventListener("error", swap);
    });
  }

  function node(n) {
    const inner = `${icon(n.icone, n.nome)}<span class="nm">${esc(n.nome)}</span>${n.sub ? `<span class="sub">${esc(n.sub)}</span>` : ""}`;
    const solo = n.sub ? "" : " solo";
    return n.link ? ext(n.link, inner, `node${solo}`) : `<span class="node${solo}">${inner}</span>`;
  }
  const flow = (nodes) => (nodes && nodes.length) ? `<div class="flow">${nodes.map(node).join('<span class="arrow" aria-hidden="true">&#10142;</span>')}</div>` : "";

  function rows(lines, heads) {
    if (!lines || !lines.length) return "";
    const body = lines.map((l) => `<tr><td>${esc(l.dado)}</td><td>${esc(l.agora)}</td><td>${esc(l.depois)}</td><td class="${cls(l.sinal)}">${esc(l.efeito)}</td></tr>`).join("");
    return `<div class="tw"><table><thead><tr>${heads.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`;
  }

  function top(p) {
    const c = p.personagem;
    return `<header class="top">
      <p class="meta">${esc(p.jogo)} · atualizado ${when(p.gerado_em)}</p>
      <h1>${esc(c.name)}</h1>
      <div class="legend"><span class="l-pos">ganho</span><span class="l-neg">perda / falta</span><span class="l-link">link da wiki</span></div>
      <div class="tw"><table><thead><tr><th>Nível</th><th class="r">Almas em mãos</th><th class="r">Soul memory</th><th>Objetivo</th></tr></thead>
        <tbody><tr><td><span class="cell-ic"><img src="icons/almas.png" alt="" onerror="this.remove()">${fmt.format(c.level)}</span></td><td class="r">${fmt.format(c.souls)}</td><td class="r">${fmt.format(c.soul_memory)}</td><td>${esc(p.objetivo)}</td></tr></tbody></table></div>
      <div class="equipped">${(c.equipado || []).map(node).join("")}</div>
    </header>`;
  }

  function changes(p) {
    return `<section><h2>Desde a última vez</h2>${p.mudancas.length ? rows(p.mudancas, ["Dado", "Antes", "Agora", "Efeito"]) : '<p class="empty">Primeira leitura do save.</p>'}</section>`;
  }

  function steps(p) {
    const items = p.passos.map((s, i) => `<li class="step">
      <div class="step-head"><span class="step-no">${i + 1}</span><span class="badge">${esc(PASSO[s.tipo] || s.tipo)}</span><span class="step-title">${esc(s.titulo)}</span></div>
      ${flow(s.fluxo)}
      ${rows(s.dados, ["Dado", "Agora", "Depois", "Efeito"])}
    </li>`).join("");
    return `<section><h2>Próximos passos</h2>${items ? `<ol class="steps">${items}</ol>` : '<p class="empty">Nenhum passo pendente.</p>'}</section>`;
  }

  function stats(p) {
    const now = p.personagem.stats, goal = p.alvo_stats;
    const list = STATS.map((k) => {
      const a = now[k], b = goal[k], pct = (v) => Math.min(v, 99) / 99 * 100;
      return `<div class="stat">
        <img src="icons/stat-${k}.png" alt="" onerror="this.style.visibility='hidden'">
        <span class="abbr">${k}</span>
        <div class="bar" role="img" aria-label="${k}: ${a} de 99, alvo ${b}"><div class="now" style="width:${pct(a)}%"></div>${b > a ? `<div class="goal" style="left:calc(${pct(b)}% - 1px)"></div>` : ""}</div>
        <span class="val">${a}${b > a ? ` <span class="pos">→ ${b}</span>` : ""}</span>
      </div>`;
    }).join("");
    return `<section><h2>Atributos</h2><div class="stats">${list}</div></section>`;
  }

  function phases(p) {
    if (!p.fases.length) return `<section><h2>Fases de nível</h2><p class="empty">Sem fases planejadas.</p></section>`;
    let acc = 0;
    const body = p.fases.map((f) => {
      acc += f.almas;
      return `<tr><td><span class="cell-ic"><img src="icons/stat-${esc(f.atributo)}.png" alt="" onerror="this.remove()">${esc(f.nome)}</span></td><td>${f.de} → ${f.ate}</td><td class="r neg">${fmt.format(f.almas)}</td><td class="r">${fmt.format(acc)}</td></tr>`;
    }).join("");
    const last = p.fases[p.fases.length - 1].ate;
    return `<section><h2>Fases de nível</h2><div class="tw"><table>
      <thead><tr><th>Fase</th><th>Nível</th><th class="r">Custo (almas)</th><th class="r">Acumulado</th></tr></thead>
      <tbody>${body}</tbody>
      <tfoot><tr><td colspan="3">Total até o nível ${last}</td><td class="r">${fmt.format(acc)}</td></tr></tfoot>
    </table></div></section>`;
  }

  function items(p) {
    const list = p.itens.map((it) => `<div class="block">
      <div class="block-head">${node(it.item)}${it.fonte ? ext(it.fonte, "fonte", "muted") : ""}</div>
      ${it.onde && it.onde.length ? `<span class="label">Onde</span>${flow(it.onde)}` : ""}
      ${rows(it.dados, ["Dado", "Agora", "Com o item", "Efeito"])}
    </div>`).join("");
    return `<section><h2>Onde pegar</h2>${list ? `<div class="blocks">${list}</div>` : '<p class="empty">Nenhum item pendente.</p>'}</section>`;
  }

  function builds(p) {
    const list = p.comparacao.map((b) => `<div class="block">
      <div class="block-head"><span class="step-title">${b.link ? ext(b.link, esc(b.build)) : esc(b.build)}</span></div>
      ${rows(b.dados, ["Dado", "Você", "Build", "Diferença"])}
      ${b.ajuste && b.ajuste.length ? `<span class="label">Ajuste sugerido</span>${flow(b.ajuste)}` : ""}
    </div>`).join("");
    return `<section><h2>Outras builds</h2>${list ? `<div class="blocks">${list}</div>` : '<p class="empty">Nenhuma comparação ainda.</p>'}</section>`;
  }

  function sources(p) {
    return `<section><h2>Fontes</h2>${p.fontes.length ? `<ul class="sources">${p.fontes.map((f) => `<li>${ext(f.url, esc(f.titulo))}${f.data ? ` <span class="muted">· ${esc(f.data)}</span>` : ""}</li>`).join("")}</ul>` : '<p class="empty">Sem fontes.</p>'}</section>`;
  }

  const app = document.getElementById("app");
  fetch("plano.json", { cache: "no-store" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((p) => { app.innerHTML = [top, changes, steps, stats, phases, items, builds, sources].map((f) => f(p)).join(""); fallbackIcons(app); })
    .catch(() => { app.innerHTML = '<p class="error">Não consegui ler o plano.json publicado junto com a página. Rode o /buildsmith:build de novo para republicar.</p>'; });
})();
</script>
